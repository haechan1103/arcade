<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="로컬에서 AI와 대결하는 물풍선 아케이드 게임"
    />
    <meta name="theme-color" content="#080d22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bubble Battle" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bubble Battle" />
    <meta
      property="og:description"
      content="AI와 대결하는 로컬 물풍선 아케이드 게임"
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      href="/icons/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
      sizes="180x180"
    />
    <title>Bubble Battle</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-frame" aria-label="Bubble Battle 게임">
        <div id="game-container"></div>
      </section>
      <section
        class="touch-controls"
        data-touch-controls
        aria-label="모바일 게임 조작"
      >
        <div class="touch-utilities" aria-label="게임 설정">
          <button
            class="touch-button touch-small"
            type="button"
            data-control="pause"
            aria-label="일시정지"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="4" width="5" height="16" rx="2"></rect>
              <rect x="14" y="4" width="5" height="16" rx="2"></rect>
            </svg>
          </button>
          <button
            class="touch-button touch-small"
            type="button"
            data-control="mute"
            aria-label="음소거"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 9v6h4l5 4V5L9 9H5Z"></path>
              <path
                class="touch-icon-stroke"
                d="M17 9.2c1.3 1.5 1.3 4.1 0 5.6M19.5 6.8c2.8 2.8 2.8 7.6 0 10.4"
              ></path>
            </svg>
          </button>
        </div>
        <div
          class="touch-joystick"
          data-joystick
          role="group"
          aria-label="이동 조이스틱"
        >
          <span class="touch-joystick-track" aria-hidden="true">
            <span
              class="touch-joystick-direction is-up"
              data-joystick-direction="up"
            ></span>
            <span
              class="touch-joystick-direction is-right"
              data-joystick-direction="right"
            ></span>
            <span
              class="touch-joystick-direction is-down"
              data-joystick-direction="down"
            ></span>
            <span
              class="touch-joystick-direction is-left"
              data-joystick-direction="left"
            ></span>
            <span class="touch-joystick-knob" data-joystick-knob></span>
          </span>
        </div>
        <div class="touch-actions" aria-label="게임 액션">
          <button
            class="touch-button touch-needle"
            type="button"
            data-control="needle"
            aria-label="바늘 사용"
          >
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle
                class="touch-icon-stroke"
                cx="9"
                cy="23"
                r="4"
              ></circle>
              <path
                class="touch-icon-stroke"
                d="m12 20 13-13M23 5l4 4M14 18l-3-3"
              ></path>
            </svg>
          </button>
          <button
            class="touch-button touch-balloon"
            type="button"
            data-control="balloon"
            aria-label="물풍선 설치"
          >
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="23" r="13"></circle>
              <path
                class="touch-icon-stroke"
                d="M25 11c0-4 2-6 6-7M30 4l3 2"
              ></path>
              <ellipse
                class="touch-icon-highlight"
                cx="16"
                cy="18"
                rx="4"
                ry="3"
              ></ellipse>
            </svg>
          </button>
        </div>
      </section>
      <p class="controls">
        <span>이동 <kbd>방향키</kbd> / <kbd>WASD</kbd></span>
        <span>물풍선 <kbd>Space</kbd></span>
        <span>바늘 <kbd>E</kbd></span>
        <span>일시정지 <kbd>Esc</kbd></span>
      </p>
    </main>
    <button
      class="mobile-fullscreen"
      type="button"
      data-fullscreen-toggle
      aria-label="전체화면 전환"
      aria-pressed="false"
    >
      <span class="mobile-fullscreen-icon" aria-hidden="true">⛶</span>
      <span data-fullscreen-label>전체화면</span>
    </button>
    <aside
      class="fullscreen-hint"
      data-fullscreen-hint
      role="status"
      aria-live="polite"
    >
      <strong>Safari 전체화면</strong>
      <span>공유 버튼 → ‘홈 화면에 추가’ 후 실행해 주세요.</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
